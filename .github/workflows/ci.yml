name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Verify module namespace
        shell: bash
        run: |
          expected='github.com/zanescope/quectel-qmi-go'
          actual="$(go list -m -f '{{.Path}}')"
          if [[ "$actual" != "$expected" ]]; then
            printf 'module path mismatch: got %s, want %s\n' "$actual" "$expected" >&2
            exit 1
          fi
          legacy="github.com/$(printf '%s' 'boa-z')/quectel-qmi-go"
          if refs="$(git grep -nF "$legacy" -- .)" && [[ -n "$refs" ]]; then
            printf 'legacy module references remain:\n%s\n' "$refs" >&2
            exit 1
          fi

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'gofmt required for:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Check module files
        run: go mod tidy -diff

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -count=1 ./...

  vohive-compat:
    name: VoHive consumer compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout quectel-qmi-go
        uses: actions/checkout@v6
        with:
          path: quectel-qmi-go

      - name: Checkout VoHive
        uses: actions/checkout@v6
        with:
          repository: ${{ format('{0}/vohive', github.repository_owner) }}
          ref: main
          path: vohive

      - name: Checkout vowifi-go
        uses: actions/checkout@v6
        with:
          repository: ${{ format('{0}/vowifi-go', github.repository_owner) }}
          ref: main
          path: vowifi-go

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: vohive/go.mod
          cache: true
          cache-dependency-path: |
            vohive/go.mod
            vohive/go.sum
            vowifi-go/go.mod
            vowifi-go/go.sum
            quectel-qmi-go/go.mod
            quectel-qmi-go/go.sum

      - name: Normalize legacy VoHive module paths in temporary checkout
        shell: bash
        run: |
          legacy_owners=('boa-z' 'iniwex5')
          pairs=()
          for legacy_owner in "${legacy_owners[@]}"; do
            pairs+=(
              "github.com/${legacy_owner}/vohive=github.com/zanescope/vohive"
              "github.com/${legacy_owner}/vowifi-go=github.com/zanescope/vowifi-go"
              "github.com/${legacy_owner}/quectel-qmi-go=github.com/zanescope/quectel-qmi-go"
            )
          done
          (
            cd vohive
            for pair in "${pairs[@]}"; do
              legacy="${pair%%=*}"
              current="${pair#*=}"
              mapfile -d '' files < <(git grep -IlzF "$legacy" -- . || true)
              if [[ ${#files[@]} -gt 0 ]]; then
                LEGACY_PATH="$legacy" CURRENT_PATH="$current" \
                  perl -0pi -e 's/\Q$ENV{LEGACY_PATH}\E/$ENV{CURRENT_PATH}/g' "${files[@]}"
              fi
              if refs="$(git grep -nF "$legacy" -- .)" && [[ -n "$refs" ]]; then
                printf 'legacy references remain after migration:\n%s\n' "$refs" >&2
                exit 1
              fi
            done
            go mod edit -dropreplace=github.com/zanescope/vowifi-go
            go mod edit -dropreplace=github.com/zanescope/quectel-qmi-go
          )

      - name: Normalize legacy vowifi-go checkout when required
        shell: bash
        run: |
          (
            cd vowifi-go
            for legacy_owner in boa-z iniwex5; do
              legacy="github.com/${legacy_owner}/vowifi-go"
              current='github.com/zanescope/vowifi-go'
              mapfile -d '' files < <(git grep -IlzF "$legacy" -- . || true)
              if [[ ${#files[@]} -gt 0 ]]; then
                LEGACY_PATH="$legacy" CURRENT_PATH="$current" \
                  perl -0pi -e 's/\Q$ENV{LEGACY_PATH}\E/$ENV{CURRENT_PATH}/g' "${files[@]}"
              fi
              if refs="$(git grep -nF "$legacy" -- .)" && [[ -n "$refs" ]]; then
                printf 'legacy vowifi-go references remain after migration:\n%s\n' "$refs" >&2
                exit 1
              fi
            done
          )

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: vohive/web/package-lock.json

      - name: Build VoHive web assets
        working-directory: vohive
        env:
          GOWORK: off
        run: ./scripts/ci.sh web

      - name: Create temporary Go workspace
        run: go work init ./vohive ./vowifi-go ./quectel-qmi-go

      - name: Resolve pinned dependencies from local fork HEADs
        shell: bash
        run: |
          vowifi_version="$(awk '$1 == "github.com/zanescope/vowifi-go" { print $2; exit }' vohive/go.mod)"
          qmi_version="$(awk '$1 == "github.com/zanescope/quectel-qmi-go" { print $2; exit }' vohive/go.mod)"
          if [[ -z "$vowifi_version" || -z "$qmi_version" ]]; then
            printf 'VoHive must directly require versioned zanescope dependencies\n' >&2
            exit 1
          fi
          go work edit "-replace=github.com/zanescope/vowifi-go@${vowifi_version}=./vowifi-go"
          go work edit "-replace=github.com/zanescope/quectel-qmi-go@${qmi_version}=./quectel-qmi-go"
          go work sync
          printf 'Using local vowifi-go HEAD for %s\n' "$vowifi_version"
          printf 'Using local quectel-qmi-go HEAD for %s\n' "$qmi_version"

      - name: Verify local fork modules
        shell: bash
        run: |
          for module in \
            github.com/zanescope/vohive \
            github.com/zanescope/vowifi-go \
            github.com/zanescope/quectel-qmi-go; do
            resolved="$(go list -m -f '{{.Path}}{{if .Main}} local{{end}}' "$module")"
            printf '%s\n' "$resolved"
            if [[ "$resolved" != "$module local" ]]; then
              printf 'module %s did not resolve to its local checkout\n' "$module" >&2
              exit 1
            fi
          done

          modules="$(go list -m all)"
          legacy_modules="$(printf '%s\n' "$modules" | grep -E '^github[.]com/(boa-z|iniwex5)/(vohive|vowifi-go|quectel-qmi-go)([[:space:]]|$)' || true)"
          if [[ -n "$legacy_modules" ]]; then
            printf 'legacy modules resolved in workspace:\n%s\n' "$legacy_modules" >&2
            exit 1
          fi

          dependencies="$(cd vohive && go list -deps ./cmd/vohive)"
          legacy_packages="$(printf '%s\n' "$dependencies" | grep -E '^github[.]com/(boa-z|iniwex5)/(vohive|vowifi-go|quectel-qmi-go)(/|$)' || true)"
          if [[ -n "$legacy_packages" ]]; then
            printf 'legacy packages resolved in workspace:\n%s\n' "$legacy_packages" >&2
            exit 1
          fi

      - name: Run full VoHive tests with current QMI checkout
        working-directory: vohive
        shell: bash
        run: |
          test_log="${RUNNER_TEMP}/vohive-go-test.log"
          if go test -count=1 ./... 2>&1 | tee "$test_log"; then
            exit 0
          fi

          {
            printf '### VoHive Go test failure\n\n'
            printf '```text\n'
            tail -n 200 "$test_log"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

          annotation="$(tail -n 80 "$test_log")"
          annotation="${annotation//'%'/'%25'}"
          annotation="${annotation//$'\r'/'%0D'}"
          annotation="${annotation//$'\n'/'%0A'}"
          printf '::error title=VoHive Go test failure::%s\n' "$annotation"
          exit 1

      - name: Build Linux amd64 VoHive with current QMI checkout
        working-directory: vohive
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -buildvcs=false -tags 'with_utls nomsgpack' -o '${{ runner.temp }}/vohive' ./cmd/vohive
